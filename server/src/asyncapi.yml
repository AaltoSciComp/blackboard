asyncapi: '2.4.0'
info:
  title: Blackboard 2.0
  version: 1.0.0
  description: | 
    Async (websocket) API description of Blackboard 2.0.
  contact:
    name: Contact Person
    email: firstname.lastname@mydomain.com
servers:
  development:
    url: blackboard-dev.mydomain.com
    description: Development server
    protocol: wss
    protocolVersion: 1.0.0
  staging:
    url: blackboard-staging.mydomain.com
    description: Staging server
    protocol: wss
    protocolVersion: 1.0.0
  production:
    url: blackboard.mydomain.com
    description: Production server
    protocol: wss
    protocolVersion: 1.0.0
components:
  schemas:
    viewsize:
      description: 'View-relative size of an item, measured as percentage of board width'
      type: number
      format: float
      examples:
        - 0.4567
    token:
      description: 'Authentication token (JWT)'
      type: string
      examples:
        - "eyJhbGciOiJIUzU1NiIsInR5cCI4IkpXVCJ9.eyJyb2xlIjoicHJlc2VudGVyIiwiaWG0IjoxNjU1Mzc4NjQ0fQ.5y2jN99HubgEmNfy-7B2pc9UXynmU27jBIjIOaTDJrA"
    sid:
      description: Presentation id
      type: integer
    ab:
      description: 'Currently active board in the presenter UI'
      type: integer
      examples:
        - 7
    sb:
      description: 'First board in the viewers screen (with offset of 0)'
      type: integer
      examples:
        - 3
    nvb:
      description: 'Number of visible boards for viewers'
      type: integer
      examples:
        - 4
    shapetype:
      description: 'Primitive type of the shape, a superset of Konva primitive types'
      type: string
      enum:
        - 'Line'
        - 'Polyline'
        - 'Arrow'
        - 'Circle'
        - 'Dot'
        - 'Ellipse'
        - 'Grid'
    shapeid:
      description: 'Database id of the shape'
      type: integer
      examples:
        - 123
    hexcolor:
      description: 'Color (hex) code'
      type: string
      examples:
        - '#5f5f5f'
    timestamp:
      description: 'Timestamp (the number of milliseconds elapsed since January 1, 1970 00:00:00 UTC).'
      type: integer
      examples:
        - 1655733722966
    x:
      description: 'X coordinate, scaled from 0 to 1 relative to canvas width'
      type: number
      minimum: 0
      maximum: 1
      examples:
        - 0.2567
    y:
      description: 'Y coordinate, scaled from 0 to 1 relative to canvas height'
      type: number
      minimum: 0
      maximum: 1
      examples:
        - 0.4352
    boardid:
      description: 'Number of the target board'
      type: integer
      examples:
        - 5
    shapedetails:
      description: 'Additional properties of the shape (ellipse radius, rectangle width, line smoothing, etc.)'
      type: object
      properties:
        strokeWidth:
          description: 'Width of the stroke of a shape, in percentage of board width'
          $ref: '#/components/schemas/viewsize'
        width:
          description: 'Width of a shape, in percentage of board width'
          $ref: '#/components/schemas/viewsize'
        height:
          description: 'Height of a shape, in percentage of board width'
          $ref: '#/components/schemas/viewsize'
        radiusX:
          description: 'X-radius of an ellipse, in percentage of board width'
          $ref: '#/components/schemas/viewsize'
        radiusY:
          description: 'Y-radius of an ellipse, in percentage of board width'
          $ref: '#/components/schemas/viewsize'
        strokeEnabled:
          description: ''
          type: boolean
        fillEnabled:
          description: ''
          type: boolean
        bezier:
          description: 'If true, the line is drawn smoothly along points'
          type: boolean
        tension:
          description: 'Additional Konva parameter for smooth lines. Higher values will result in a more curvy line.'
          type: number
        closed:
          description: 'Is the shape closed, i.e. if the end is automatically connected to start (applies to lines only)'
          type: boolean
    shapedata:
      description: Coordinate points with timestamps (only for lines)
      type: array
      items:
        type: array
        items:
          - $ref: '#/components/schemas/timestamp'
          - $ref: '#/components/schemas/x'
          - $ref: '#/components/schemas/y'
      examples:
        -
          - 
            -
              - 0
              - 0
              - 0
            - 
              - 512
              - -0.00469
              - -0.00217
            - 
              - 728
              - -0.0087
              - -0.00543
            -
              - 745
              - -0.01339
              - -0.00761
    boardsettings:
      type: object
      properties:
        bg:
          type: object
          properties:
            visible:
              description: 'Do we display the background image'
              type: boolean
            url:
              description: 'URL of the background image'
              type: string
        grid:
          type: object
          properties:
            visible:
              description: 'Do we display the grid for presenter'
              type: boolean
            stroke:
              description: 'Stroke color for grid lines'
              $ref: '#/components/schemas/hexcolor'
            strokeWidth:
              $ref: '#/components/schemas/viewsize'
            opacity:
              description: 'Grid opacity'
              type: number
              format: float
              minimum: 0
              maximum: 1
            cellWidth:
              description: 'Cell width'
              $ref: '#/components/schemas/viewsize'
            cellHeight:
              description: 'Cell height'
              $ref: '#/components/schemas/viewsize'
            square:
              description: 'Do we try to keep the grid cells square in the presenter view'
              type: boolean
            snap:
              description: 'Do we snap to grid'
              type: boolean
            present:
              description: 'Do we display the grid also for viewers'
              type: boolean
            aspect:
              type: number
              format: float
              examples:
                - 1.6352800953516091
channels:
  blackboard:
    publish:
      message:
        oneOf:
        - name: admin_notification
          title: Admin notification
          summary: Notify all users
          description: Notify all users with an automatically timestamped message
          payload:
            type: object
            properties:
              message:
                description: Message with a timestamp prepended on it
                type: string
            examples:
              - message: "16.23.32: We need to restart the server, please check back in 2 minutes."
        - name: viewer_count
          title: Viewer count
          summary: Notify presenter of a changed viewer count
          payload:
            type: integer
            examples:
              - 4
        - name: login_failed
          title: Login failed
          summary: Emitted to viewer upon a failed login attempt
          payload:
            type: string
            examples:
              - 'Session data not found'
              - 'Incorrect password: foo'
        - name: login_success
          title: Login success
          summary: Emitted to viewer upon a successful login attempt
          payload:
            type: object
            properties:
              nvb:
                $ref: '#/components/schemas/nvb'
              ab:
                $ref: '#/components/schemas/ab'
              sb:
                $ref: '#/components/schemas/sb'
              defaultBoardColor:
                $ref: '#/components/schemas/hexcolor'
              token:
                $ref: '#/components/schemas/token'
            examples:
              - payload:
                nvb: 4
                ab: 1
                sb: 1
                defaultBoardColor: '#5f5f5f'
                token: "eyJhbGciOiJIUzU1NiIsInR5cCI4IkpXVCJ9.eyJyb2xlIjoicHJlc2VudGVyIiwiaWG0IjoxNjU1Mzc4NjQ0fQ.5y2jN99HubgEmNfy-7B2pc9UXynmU27jBIjIOaTDJrA"
        - name: password_changed
          title: Password changed
          summary: Inform viewers of a viewer password change (no parameters needed)
        - name: session_deleted
          title: Session deleted
          summary: Inform presenter that the server has successfully deleted session
        - name: fatal_error
          title: Fatal error
          summary: Error message emitted to presenter when the session needs to close immediately (like claim_board failing)
          payload:
            type: string
            examples:
              - 'Board already claimed'
        - name: draw_shape
          title: Draw shape
          summary: Ask all viewers to draw a new shape on one of the boards
          payload:
            type: object
            properties:
              shapetype:
                $ref: '#/components/schemas/shapetype'
              shapeid:
                $ref: '#/components/schemas/shapeid'
              stroke:
                $ref: '#/components/schemas/hexcolor'
              fill:
                $ref: '#/components/schemas/hexcolor'
              starttime:
                $ref: '#/components/schemas/timestamp'
              x:
                $ref: '#/components/schemas/x'
              y:
                $ref: '#/components/schemas/y'
              boardid:
                $ref: '#/components/schemas/boardid'
              shapedetails:
                $ref: '#/components/schemas/shapedetails'
              shapedata:
                description: Coordinate points with timestamps (only for lines)
                type: object
            examples:
              - shapetype: "Ellipse"
                shapeid: 201,
                stroke: "#f5f5f5"
                fill: "#f5f5f5"
                starttime: 1655733551107
                x: 0.77758
                y: 0.21336
                boardid: 1
                shapedetails:
                  strokeWidth: 0.40027
                  strokeEnabled: true
                  fillEnabled: false
                  radiusY: 0.07686
                  radiusX: 0.04733
              - shapetype: "Line"
                shapeid: 202
                stroke: "#f5f5f5"
                fill: "#f5f5f5"
                starttime: 1655733722966
                x: 0.34003
                y: 0.11848
                boardid: 1
                shapedetails:
                  strokeWidth: 0.40027
                  strokeEnabled: true
                  fillEnabled: false
                  bezier: true
                  tension: 0.3
                  closed: false
                shapedata:
                  -
                    - 0
                    - 0
                    - 0
                  - 
                    - 512
                    - -0.00469
                    - -0.00217
                  - 
                    - 728
                    - -0.0087
                    - -0.00543
                  -
                    - 745
                    - -0.01339
                    - -0.00761
        - name: shape_modified
          title: Shape modified
          summary: Ask all viewers to update shapedetails on one of the boards
          payload:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/shapeid'
              boardid:
                $ref: '#/components/schemas/boardid'
              shapedetails:
                $ref: '#/components/schemas/shapedetails'
            examples:
              - id: 199
                boardid: 1
                shapedetails:
                  radiusX: 5.63224
                  radiusY: 8.37768
                  fillEnabled: false
                  strokeWidth: 0.4
                  strokeEnabled: true
        - name: shapes_deleted
          title: Shapes deleted
          summary: Ask all viewers to delete listed shapes from a board
          payload:
            type: object
            properties:
              shapeids:
                description: Array of database ids of shapes to delete
                type: array
                items:
                  $ref: '#/components/schemas/shapeid'
            examples:
              - shapeids:
                  - 201
                  - 198
        - name: shapes_recolored
          title: Shapes recolored
          summary: Ask all viewers to recolor listed shapes from a board
          payload:
            type: object
            properties:
              color:
                description: Color (hex) code to use in recoloring
                $ref: '#/components/schemas/hexcolor'
              shapeids:
                description: Array of database ids of shapes to recolor
                type: array
                items:
                  $ref: '#/components/schemas/shapeid'
            examples:
              - color: "#bd8900"
                shapeids:
                  - 201
                  - 198
        - name: change_board_settings
          title: Change board settings
          summary: Send new board settings for the grid views.
          payload:
            type: object
            properties:
              sid:
                $ref: '#/components/schemas/sid'
              boardid:
                $ref: '#/components/schemas/boardid'
              settings:
                type: object
                properties:
                  color:
                    $ref: '#/components/schemas/hexcolor'
                  settings:
                    $ref: '#/components/schemas/boardsettings'
        - name: clear_all
          title: Clear all
          summary: Clear all boards (no parameters required)
        - name: clear_board
          title: Clear board
          summary: Delete shapes from a given board
          payload:
            type: object
            properties:
              boardid:
                $ref: '#/components/schemas/boardid'
        - name: board_data
          title: Board data
          summary: Send all data needed for drawing a single board
          payload:
            type: object
            properties:
              mod:
                $ref: '#/components/schemas/timestamp'
              data:
                description: Actual board and drawing data (object with boardid, settings, data)
                type: object
        - name: reconfigure_boards
          title: Reconfigure boards
          summary: Notify about a change in the number of visible boards
          payload:
            type: object
            properties:
              sb:
                $ref: '#/components/schemas/sb'
              ab:
                $ref: '#/components/schemas/ab'
              nvb:
                $ref: '#/components/schemas/nvb'
            examples:
              - ab: 1
                sb: 1
                nvb: 9
        - name: presenter_connected
          title: Presenter connected
          summary: Notify viewers that the presenter has connected to server
        - name: presenter_disconnected
          title: Presenter disconnected
          summary: Notify viewers that the presenter has disconnected from server
        - name: play_shapes
          title: Play shapes
          summary: 'Inform the grid views to replay shapes on a board (NOTE: not currently implemented)'
          payload:
            type: object
            properties:
              sid:
                $ref: '#/components/schemas/sid'
        - name: laserloc
          title: Laser pointer location
          summary: Set laser pointer location (and board) for viewers
          payload:
            type: object
            properties:
              b:
                $ref: '#/components/schemas/boardid'
              x:
                $ref: '#/components/schemas/x'
              y:
                $ref: '#/components/schemas/y'
            examples:
              - b: 1
                x: "0.157"
                y: "0.051"
        - name: laser_on
          title: Switch laser pointer on
          summary: Tell viewers to switch on laser pointer
          payload:
            type: object
            properties:
              color:
                $ref: '#/components/schemas/hexcolor'
              size:
                description: Laser pointer size (percent of canvas width)
                $ref: '#/components/schemas/viewsize'
            examples:
              - color: "#ff0000"
                size: 1
        - name: laser_off
          title: Switch laser pointer off
          summary: Tell viewers to switch off laser pointer
        - name: set_active_board
          title: Set active board
          summary: Notify viewers about a change of currently active board
          payload:
            type: object
            properties:
              ab:
                $ref: '#/components/schemas/ab'
              sb:
                $ref: '#/components/schemas/sb'
              nvb:
                $ref: '#/components/schemas/nvb'
              mods:
                description: Timestamps of visible boards in the new configuration
                type: array
                items:
                  $ref: '#/components/schemas/timestamp'
            examples:
              - ab: 2
                sb: 1
                nvb: 4
                mods:
                  - 1655809356443
                  - 1655808406235
                  - 1655808406235
                  - 1655808406235
        - name: clear_board
          title: Clear board
          summary: Inform the grid views of a cleared board.
          payload:
            type: object
            properties:
              boardId:
                $ref: '#/components/schemas/boardid'
            examples:
              - boardid: 1
        - name: change_board_settings
          title: Change board settings
          summary: Send new board settings for the grid views.
          payload:
            type: object
            properties:
              boardid:
                $ref: '#/components/schemas/boardid'
              settings:
                type: object
                properties:
                  color:
                    $ref: '#/components/schemas/hexcolor'
                  settings:
                    $ref: '#/components/schemas/boardsettings'
            examples:
              - boardid: 1
                settings:
                  color: "#750058"
                  settings:
                    bg:
                        visible: false
                        url: ""
                    grid:
                      visible: false
                      stroke: "#ffffff"
                      strokeWidth: 0.04
                      opacity: 0.25
                      cellWidth: 2.4
                      cellHeight: 4
                      square: true
                      snap: false
                      present: false
                      aspect: 1.6352800953516091
    subscribe:
      message:
        oneOf:
        - name: admin_notification
          title: Admin notification
          summary: Notify all users (admin only)
          description: Notify all users via a special command-line script, only accessible from within the server container.
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              message:
                description: Message to broadcast
                type: string
        - name: viewer_login
          title: Viewer login
          summary: New client requests access to grid view
          payload:
            type: object
            properties:
              pw:
                description: Viewer password
                type: string
              sid:
                $ref: '#/components/schemas/sid'
              offset:
                description: Optional offset to the board range returned
                type: integer
        - name: request_boards
          title: Request boards
          summary: Request data for one or more boards
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              from:
                description: First board to request data from
                type: integer
              to:
                description: Last board to request data from
                type: integer
        - name: claim_board
          title: Claim presenter status
          summary: Claim presenter status for presentation
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
        - name: reconfigure_boards
          title: Reconfigure boards
          summary: Notify about a change in the number of visible boards (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              sb:
                $ref: '#/components/schemas/sb'
              ab:
                $ref: '#/components/schemas/ab'
              nvb:
                $ref: '#/components/schemas/nvb'
        - name: play_shapes
          title: Play shapes
          summary: Inform the grid views to replay shapes on a board (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
        - name: laserloc
          title: Laser pointer location
          summary: Set laser pointer location (and board) for viewers (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              b:
                $ref: '#/components/schemas/boardid'
              x:
                $ref: '#/components/schemas/x'
              y:
                $ref: '#/components/schemas/y'
        - name: laser_on
          title: Switch laser pointer on
          summary: Tell viewers to switch on laser pointer (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              color:
                $ref: '#/components/schemas/hexcolor'
              size:
                description: Laser pointer size (percent of canvas width)
                type: integer
        - name: laser_off
          title: Switch laser pointer off
          summary: Tell viewers to switch off laser pointer
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
        - name: set_active_board
          title: Set active board
          summary: Notify viewers about a change of currently active board (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              startId:
                $ref: '#/components/schemas/sb'
              boardId:
                $ref: '#/components/schemas/boardid'
        - name: clear_board
          title: Clear board
          summary: Inform the grid views of a cleared board (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              boardId:
                $ref: '#/components/schemas/boardid'
        - name: change_board_settings
          title: Change board settings
          summary: Send new board settings for the grid views (presenter only).
          payload:
            type: object
            properties:
              token:
                $ref: '#/components/schemas/token'
              sid:
                $ref: '#/components/schemas/sid'
              settings:
                $ref: '#/components/schemas/boardsettings'
